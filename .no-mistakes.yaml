# no-mistakes 门禁配置（仅从默认分支读取）。
# 审查由 GPT-6（中档）经 pi 执行；pi 无法启动或出错退出时，由 Claude Opus 5.5（高档）后备。
# 模型与推理档位在操作者的全局 no-mistakes 配置中设定，不在本文件。
agent: [pi, claude]

commands:
  prepare: "pnpm install --frozen-lockfile"
  lint: "pnpm lint:check && pnpm format:check"

review:
  path_instructions:
    - path: "**"
      instructions: |
        只审本 PR 声明要解决的问题。与本 PR 无关的既有问题记为后续事项，不作为阻塞发现。
        对每个 PR 依次检查四点：
        1. 完整性：改动是否完整解决所声明的问题；同一根因的其他直接调用方是否遗漏。
        2. 行为偏移：是否改变了未声明的用户可见行为或业务契约，例如询盘送达、切换语言时保留已填内容、错误兜底。
        3. 项目契合：是否为最小改动；是否在没有真实消费者和可复现失败的情况下新增依赖、抽象、配置、环境变量、兼容层、门禁或脚本；是否顺手重构或扩大范围；净增代码是否有理由。
        4. 重大风险：询盘送达、数据完整性、安全、可访问性、发布真实性。
        证据核对（按改动类型）：
        - 修复缺陷：描述或提交说明中必须写明复现测试在修复前失败、修复后通过的命令与结果，以及相关回归检查的结果；缺失或与代码不符即为发现。
        - 新增或改写测试：必须保护可观察行为，并写明反向检查（被保护的行为被改坏时测试失败）的命令与结果；只测实现细节、mock 被测对象本身、削弱或删除断言，都是发现。
        - 其他代码、测试或配置改动（含删除与重构）：必须附引用检索结果和相关检查的实际运行结果；只有文字说明、没有运行结果即为发现。
        - 纯文档改动（不影响可执行代码或配置）：不要求运行证据；其中关于代码、规则或流程的事实陈述必须与仓库现状一致，不一致即为发现。
        不得调用真实的 Resend、Airtable、Turnstile、Upstash，不得发送真实询盘。

test:
  instructions: |
    按改动范围先运行能证明结果的最窄验证，再按影响范围扩大；完整回归由 CI 负责。
    不得调用真实的 Resend、Airtable、Turnstile、Upstash，不得发送真实询盘；需要真实环境的验证写明留给人工。
