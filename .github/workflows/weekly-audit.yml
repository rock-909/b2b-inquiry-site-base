name: Weekly dependency audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-production-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level moderate

      - name: Full dependency audit (informational)
        continue-on-error: true
        run: |
          # 含开发依赖，不发给访客；不阻塞门禁，只求可见
          # 摘要按 Markdown 渲染，纯文本表格不套围栏会被吃掉空白，读不成行
          echo '## 全量依赖审计（含开发依赖，不阻塞）' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          pnpm audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Sync dependency audit issue
        # 失败时开 issue 或在已开的 issue 上追加评论；恢复后关闭，避免旧 issue 让之后的失败静默。
        if: ${{ !cancelled() && (steps.audit.outcome == 'failure' || steps.audit.outcome == 'success') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const title = "Weekly production dependency audit failed";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const open = issues.filter((issue) => !issue.pull_request && issue.title === title);
            if (process.env.AUDIT_OUTCOME === "failure") {
              if (open.length === 0) {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body: `The scheduled production dependency audit failed.\n\nRun: ${runUrl}`,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: open[0].number,
                  body: `The production dependency audit failed again.\n\nRun: ${runUrl}`,
                });
              }
              return;
            }
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `The production dependency audit passed; closing.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Fail when the dependency audit step fails
        if: ${{ !cancelled() && steps.audit.outcome == 'failure' }}
        run: exit 1
