name: Weekly dependency audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-production-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level moderate

      - name: Full dependency audit (informational)
        continue-on-error: true
        run: |
          # 含开发依赖，不发给访客；不阻塞门禁，只求可见
          # 摘要按 Markdown 渲染，纯文本表格不套围栏会被吃掉空白，读不成行
          echo '## 全量依赖审计（含开发依赖，不阻塞）' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          pnpm audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Open dependency audit issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Weekly production dependency audit failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (!issues.some((issue) => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The scheduled production dependency audit failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

      - name: Fail when the dependency audit step fails
        if: ${{ !cancelled() && steps.audit.outcome == 'failure' }}
        run: exit 1
