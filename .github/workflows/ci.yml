name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "pr/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: L1/L2 静态与架构质量
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint 检查
        run: pnpm lint:check

      - name: Prettier 检查
        run: pnpm format:check

      - name: React Doctor
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm react:doctor --base "origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ]; then
            pnpm react:doctor --base "$BEFORE_SHA"
          else
            pnpm react:doctor --base "$(git rev-parse HEAD^)"
          fi

      - name: TypeScript 检查
        run: pnpm type-check

      - name: 测试 TypeScript 检查
        run: pnpm type-check:tests

      - name: 内容结构检查
        run: pnpm content:check

      - name: Dependency cruiser architecture check
        run: pnpm exec dependency-cruiser src --config .dependency-cruiser.js -T err

      - name: Dead-export / dead-file scan (knip)
        run: pnpm knip:check

      - name: Production-only dead-file scan (knip, tests are not entries)
        run: pnpm knip:check:production

  tests:
    name: L3 单元与集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行测试
        run: pnpm test

  e2e:
    name: L3 浏览器冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: 设置 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 生产构建
        run: pnpm build
        env:
          NODE_ENV: production
          APP_ENV: preview
          NEXT_PUBLIC_TEST_MODE: "true"
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # Turnstile 的测试占位读的是 NEXT_PUBLIC_APP_ENV，不是 APP_ENV。
          NEXT_PUBLIC_APP_ENV: preview
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
          # 假 GA ID 只为渲染同意横幅；用例用“拒绝”关闭横幅，且 GA 请求在用例内被拦截。
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-E2ETEST000"

      # 不点名文件：点名过的多份清单各不相同，
      # 结果有 3 个用例文件哪个 workflow 都没跑到。改成让 testDir 说了算。
      - name: 运行 E2E
        run: pnpm exec playwright test

      - name: 上传 Playwright 失败诊断
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            reports/playwright-report
            reports/playwright-results.json
            reports/playwright-results.xml
            test-results
          if-no-files-found: ignore
          retention-days: 7

  semgrep:
    name: L1/L2 Semgrep 安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.181.0

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: 运行 Semgrep
        # 扫描全仓，包括实际执行的脚本和根配置。
        run: semgrep scan --error --severity ERROR --config semgrep.yml .

      - name: 验证测试治理规则的正反例与扫描范围
        run: python3 tests/fixtures/semgrep/check.py

  cloudflare-build:
    name: L4 Cloudflare 构建合同
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: 设置 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 分析构建（保留 sourcemap，供 client-boundary 使用）
        run: pnpm build
        env:
          NODE_ENV: production
          APP_ENV: preview
          NEXT_PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PREVIEW_URL || 'https://example.invalid' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}

      - name: InquiryForm client chunk boundary
        run: node scripts/quality/checks/client-boundary.js --build-artifacts

      - name: Localized prerender behavior check
        run: node scripts/quality/checks/prerender-static.js
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PREVIEW_URL || 'https://example.invalid' }}

      - name: Cloudflare/OpenNext 构建
        run: pnpm website:build:cf
        env:
          NODE_ENV: production
          APP_ENV: preview
          DEPLOYMENT_PLATFORM: cloudflare
          NEXT_PUBLIC_DEPLOYMENT_PLATFORM: cloudflare
          NEXT_PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PREVIEW_URL || 'https://example.invalid' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}

      - name: 验证 Cloudflare artifact config
        run: node scripts/quality/checks/cloudflare-artifact-config.js

      - name: Cloudflare 静态资源响应头
        run: node scripts/quality/checks/cloudflare-static-asset-headers.js

      - name: Cloudflare Static Assets cache populate
        run: pnpm exec opennextjs-cloudflare populateCache local --env preview
        env:
          NODE_ENV: production
          APP_ENV: preview
          DEPLOYMENT_PLATFORM: cloudflare
          NEXT_PUBLIC_DEPLOYMENT_PLATFORM: cloudflare
          NEXT_PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PREVIEW_URL || 'https://example.invalid' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}

      - name: 验证 Static Assets 缓存已填充
        run: node scripts/quality/checks/cloudflare-artifact-config.js --static-assets-cache

      - name: Cloudflare/Wrangler dry-run
        run: pnpm exec wrangler deploy --dry-run --env preview
        env:
          NODE_ENV: production
          APP_ENV: preview
          DEPLOYMENT_PLATFORM: cloudflare
          NEXT_PUBLIC_DEPLOYMENT_PLATFORM: cloudflare
          NEXT_PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_PREVIEW_URL || 'https://example.invalid' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}

  ci-summary:
    name: CI 汇总
    runs-on: ubuntu-latest
    needs: [quality, tests, e2e, semgrep, cloudflare-build]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 检查所有作业状态
        run: |
          {
            echo "## CI Jobs"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| L1/L2 静态与架构质量 | ${{ needs.quality.result }} |"
            echo "| L3 单元与集成测试 | ${{ needs.tests.result }} |"
            echo "| L3 浏览器冒烟 | ${{ needs.e2e.result }} |"
            echo "| L1/L2 Semgrep 安全扫描 | ${{ needs.semgrep.result }} |"
            echo "| L4 Cloudflare 构建合同 | ${{ needs.cloudflare-build.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.quality.result }}" != "success" ||
                "${{ needs.tests.result }}" != "success" ||
                "${{ needs.e2e.result }}" != "success" ||
                "${{ needs.semgrep.result }}" != "success" ||
                "${{ needs.cloudflare-build.result }}" != "success" ]]; then
            echo "CI failed"
            exit 1
          fi
