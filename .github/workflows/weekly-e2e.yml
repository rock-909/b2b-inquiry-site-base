name: Weekly browser matrix

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-browser-matrix
  cancel-in-progress: false

jobs:
  e2e:
    name: Coverage-mapped browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build production app
        run: pnpm build
        env:
          NODE_ENV: production
          APP_ENV: preview
          NEXT_PUBLIC_TEST_MODE: "true"
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # Turnstile 的测试占位读的是 NEXT_PUBLIC_APP_ENV，不是 APP_ENV。
          NEXT_PUBLIC_APP_ENV: preview
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
          # 假 GA ID 只为渲染同意横幅；playwright.config.ts 在浏览器启动层屏蔽 GA 域名。
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-E2ETEST000"
          SECURITY_HEADERS_ENABLED: "false"

      # 同 ci.yml：不点名文件，testDir 下的用例全跑。这条 lane 浏览器矩阵全开 +
      # 零重试，用来把 ci.yml 里被重试盖掉的首次失败暴露出来。注意构建关闭了安全头，
      # 所以这里不覆盖 CSP；CSP 只在 ci.yml 的 Chromium job 中实测。
      - name: Run weekly browser matrix
        run: pnpm exec playwright test
        env:
          CI_FULL_COVERAGE: "true"
          # Zero Playwright retries so a first-attempt browser failure stays red.
          CI_FLAKE_SAMPLING: "1"

      - name: Upload Playwright artifacts
        # 只在失败时上传，避免占满账号共享的 artifact 配额。
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-browser-matrix-artifacts
          path: |
            reports/playwright-report
            reports/playwright-results.json
            reports/playwright-results.xml
            test-results
          if-no-files-found: ignore
          retention-days: 7
