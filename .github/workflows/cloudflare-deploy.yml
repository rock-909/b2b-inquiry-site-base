name: Cloudflare Workers 部署 / 外部 URL smoke

# ============================================================================
# 职责：Cloudflare Workers 部署 + MISSING_MESSAGE 检测 + 健康检查
# 触发：手动触发（workflow_dispatch）
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      preview_url:
        description: '外部 URL 健康检查目标（environment=preview 时必填；不证明当前 SHA 已部署）'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  # Preview may cancel a superseded run; production never cancels so an
  # in-flight production deploy runs through post-deploy verification.
  cancel-in-progress: ${{ inputs.environment != 'production' }}

jobs:
  build-and-deploy:
    name: Cloudflare Workers 部署 / 外部 URL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      deployment_url: ${{ steps.resolve_urls.outputs.deployment-url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 检查 Cloudflare 凭据
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ Cloudflare secrets 未配置"
            echo "需要: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "✅ Cloudflare 凭据已配置"

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          standalone: true

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: 安装依赖
        if: ${{ inputs.environment == 'production' }}
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright Chromium
        if: ${{ inputs.environment == 'production' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: 阻断：production 只能从 main 部署
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "❌ production 部署只能从 main 分支触发，当前分支: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 导出 production public vars（wrangler）
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const ts = require("typescript");

          const parsed = ts.parseConfigFileTextToJson(
            "wrangler.jsonc",
            fs.readFileSync("wrangler.jsonc", "utf8"),
          );

          if (parsed.error) {
            console.error(
              ts.flattenDiagnosticMessageText(parsed.error.messageText, "\n"),
            );
            process.exit(1);
          }

          const vars = parsed.config?.env?.production?.vars;
          const requiredKeys = [
            "APP_ENV",
            "DEPLOYMENT_PLATFORM",
            "NEXT_PUBLIC_BASE_URL",
            "NEXT_PUBLIC_SITE_URL",
            "NEXT_PUBLIC_DEPLOYMENT_PLATFORM",
            "NEXT_PUBLIC_TURNSTILE_SITE_KEY",
            "NEXT_PUBLIC_TEST_MODE",
            "SECURITY_HEADERS_ENABLED",
            "NEXT_PUBLIC_SECURITY_MODE",
          ];

          if (!vars || typeof vars !== "object" || Array.isArray(vars)) {
            console.error("wrangler.jsonc env.production.vars is missing");
            process.exit(1);
          }

          const lines = [];
          for (const key of requiredKeys) {
            const value = vars[key];
            if (typeof value !== "string" || value.trim().length === 0) {
              console.error(`wrangler production var ${key} is missing`);
              process.exit(1);
            }
            lines.push(`${key}=${value}`);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      - name: 阻断：production 严格上线配置
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          PUBLIC_LAUNCH_STRICT=true APP_ENV=production node scripts/starter-checks.js validate-production-config
        env:
          CI: true
          NODE_ENV: production
          RATE_LIMIT_PEPPER: ${{ secrets.RATE_LIMIT_PEPPER }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}

      - name: 阻断：production 严格内容就绪（launch 门禁）
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          node scripts/starter-checks.js content-readiness --strict-client-launch

      - name: 外部 URL smoke（preview 输入）
        if: ${{ inputs.environment == 'preview' }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_URL" ]; then
            echo "❌ preview 外部 URL smoke 需要填写 preview_url" >&2
            exit 1
          fi
          node scripts/starter-checks.js external-url-smoke --base-url "${PREVIEW_URL}"
        env:
          CI: true
          NODE_ENV: production
          APP_ENV: preview
          PREVIEW_URL: ${{ inputs.preview_url }}

      - name: Production release proof
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          pnpm release:verify
        env:
          CI: true
          NODE_ENV: production
          APP_ENV: production
          RATE_LIMIT_PEPPER: ${{ secrets.RATE_LIMIT_PEPPER }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}

      - name: 构建（Cloudflare Workers）
        if: ${{ inputs.environment == 'production' }}
        id: build
        run: |
          set -euo pipefail
          pnpm website:build:cf 2>&1 | tee cf_build.log
          echo "log-path=$(pwd)/cf_build.log" >> "$GITHUB_OUTPUT"
        env:
          CI: true
          NODE_ENV: production
          APP_ENV: ${{ inputs.environment }}
          RATE_LIMIT_PEPPER: ${{ secrets.RATE_LIMIT_PEPPER }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}

      - name: 阻断：检测 next-intl MISSING_MESSAGE
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          if grep -E -i "MISSING_MESSAGE" cf_build.log; then
            echo "❌ Detected next-intl MISSING_MESSAGE in build logs"
            exit 1
          else
            echo "✅ No MISSING_MESSAGE found"
          fi

      - name: 上传构建日志
        if: ${{ always() && inputs.environment == 'production' }}
        uses: actions/upload-artifact@v7
        with:
          name: cf-build-log-${{ inputs.environment }}
          path: cf_build.log
          if-no-files-found: ignore

      - name: 部署到 Cloudflare Workers（production）
        if: ${{ inputs.environment == 'production' }}
        id: deploy_production
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT=$(pnpm exec opennextjs-cloudflare deploy --env production 2>&1) || {
            echo "❌ 部署失败"
            echo "$DEPLOY_OUTPUT"
            exit 1
          }
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            echo "❌ 未从部署输出中提取到 workers.dev URL"
            exit 1
          fi
          echo "production-url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "✅ 部署成功"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production

      - name: 汇总 URL
        id: resolve_urls
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" = "preview" ]; then
            if [ -z "$PREVIEW_URL" ]; then
              echo "❌ preview_url 为空，无法导出外部检查 URL" >&2
              exit 1
            fi
          else
            if [ -z "$PRODUCTION_URL" ]; then
              echo "❌ production 部署没有输出 deployment URL" >&2
              exit 1
            fi
            echo "deployment-url=${PRODUCTION_URL}" >> "$GITHUB_OUTPUT"
          fi
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          PRODUCTION_URL: ${{ steps.deploy_production.outputs.production-url }}

      - name: 部署总结
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "preview" ]; then
            echo "## ☁️ 外部 URL smoke 总结" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ☁️ Cloudflare Workers 部署总结" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **环境**: ${DEPLOY_ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发者**: ${GITHUB_ACTOR}" >> $GITHUB_STEP_SUMMARY
          if [ "$DEPLOY_ENVIRONMENT" = "preview" ]; then
            echo "- **外部检查 URL**: ${PREVIEW_URL}" >> $GITHUB_STEP_SUMMARY
            echo "- **说明**: preview 分支只检查传入 URL 可访问性，不证明当前 SHA 已部署" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$DEPLOYMENT_URL" ]; then
            echo "- **部署 URL**: ${DEPLOYMENT_URL}" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.resolve_urls.outputs.deployment-url }}

  post-deploy-verification:
    name: 部署后验证
    runs-on: ubuntu-latest
    needs: build-and-deploy
    timeout-minutes: 10
    if: ${{ inputs.environment == 'production' && needs.build-and-deploy.outputs.deployment_url != '' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 等待部署就绪
        run: |
          set -euo pipefail
          url="${{ needs.build-and-deploy.outputs.deployment_url }}"
          echo "等待部署就绪: $url"

          max_tries=30
          delay=5

          for i in $(seq 1 $max_tries); do
            status=$(curl -s -o /dev/null -w "%{http_code}" -I "$url" || echo "000")
            if [ "$status" = "000" ]; then
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            fi

            echo "第 $i 次探测: $status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "部署已就绪"
              exit 0
            fi

            if [ $((i % 10)) -eq 0 ] && [ "$delay" -lt 15 ]; then
              delay=$((delay + 5))
            fi
            sleep "$delay"
          done
          echo "等待超时" >&2
          exit 1

      - name: 健康检查
        run: |
          set -euo pipefail
          echo "Cloudflare deployed proof: running final post-deploy smoke against the deployed URL"
          if [ ! -f ./scripts/starter-checks.js ]; then
            echo "❌ Missing ./scripts/starter-checks.js in workflow checkout" >&2
            ls -la ./scripts || true
            ls -la ./scripts/deploy || true
            exit 1
          fi
          node ./scripts/starter-checks.js deployed-smoke --base-url "${{ needs.build-and-deploy.outputs.deployment_url }}"
