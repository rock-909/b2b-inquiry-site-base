# 本地 Git 质量门禁。
assert_lefthook_installed: false
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    # 只检查暂存文件，不修改工作区。
    format-check:
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,yml,yaml,css,scss,html}"
      run: pnpm exec prettier --check {staged_files}
      fail_text: '代码格式检查失败 - 请运行 pnpm exec prettier --write <files> 修复格式问题'

    eslint-check:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint --config eslint.config.mjs --max-warnings 0 {staged_files}
      fail_text: '暂存文件 ESLint 检查失败 - 请修复 lint 问题后再提交'

    # 多语言同步检查
    i18n-sync:
      run: |
        if git diff --cached --name-only | grep -E '^(messages/|i18n\.(json|ts)$|src/.+i18n|translation\.config\.js)' >/dev/null; then
          node scripts/quality/checks/translations.js
        else
          echo "跳过 i18n 同步检查（无相关变更）"
        fi
      fail_text: '翻译验证失败 - 请同步 messages 物理包与内容文件'
      stage_fixed: false

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      fail_text:
        '提交信息不符合规范 - 请使用约定式提交格式：type(scope): description'
